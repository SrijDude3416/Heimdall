name: Heimdall
options:
  bundleIdPrefix: com.srija
configs:
  Debug: debug
  Release: release
targets:
  Heimdall:
    type: application
    platform: macOS
    sources:
      - path: Heimdall
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srija.Heimdall
        DEVELOPMENT_TEAM: 3TS9RHS97C
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_FILE: Heimdall/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
